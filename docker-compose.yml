services:
  hearthwatch:
    image: ghcr.io/spokator/hearthwatch:latest
    build: .
    container_name: hearthwatch
    restart: unless-stopped
    # Valheim saves the world when it stops: give it time.
    stop_grace_period: 2m
    env_file: .env
    ports:
      # Valheim uses the game port and the next one: keep them consecutive.
      - "2456-2457:2456-2457/udp"
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-8080}:8080/tcp"
    volumes:
      - hearthwatch-data:/data

  # Optional automatic HTTPS: docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?Set DOMAIN in .env} --to hearthwatch:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hearthwatch

volumes:
  hearthwatch-data:
  caddy-data:
  caddy-config:
