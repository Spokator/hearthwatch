; Hearthwatch process manager: the Valheim server and the web panel run side by side.
; The panel controls the "valheim" program through the unix socket (supervisorctl).

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:valheim]
command=/opt/hearthwatch/scripts/start-valheim.sh
autostart=true
; Restart after a crash, but not after a stop requested from the panel.
autorestart=unexpected
exitcodes=0
startsecs=10
startretries=3
; SIGINT makes Valheim save the world before exiting.
stopsignal=INT
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:panel]
command=node /opt/hearthwatch/panel/server/index.js
directory=/opt/hearthwatch/panel
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
